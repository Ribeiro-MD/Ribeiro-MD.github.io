# Guarda uma vez por dia os downloads dos mods em CurseForgeStats/historico.js
name: CurseForge Stats

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recolher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 CurseForgeStats/recolher.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CurseForgeStats/historico.js
          git diff --cached --quiet || git commit -m "CurseForge Stats: registo diário"
          git push
