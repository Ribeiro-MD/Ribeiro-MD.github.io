# Guarda de 6 em 6 horas os downloads dos mods em CurseForgeStats/historico.js
name: CurseForge Stats

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recolher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 CurseForgeStats/recolher.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CurseForgeStats/historico.js
          git diff --cached --quiet && exit 0
          git commit -m "CurseForge Stats: registo"
          # se entretanto houve outro push, junta-se a ele e tenta outra vez
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          exit 1
